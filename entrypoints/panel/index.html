<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>速写 · LeetCode 智能补全</title>
    <script type="module" src="./main.ts"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body id="framed">
    <main class="card">
      <div class="aurora" aria-hidden="true"></div>
      <canvas class="fluid" aria-hidden="true"></canvas>
      <div class="glow" aria-hidden="true"></div>

      <header class="brand">
        <img class="brand__icon" src="/icon/96.png" alt="" width="44" height="44" />
        <span class="brand__text">
          <span class="brand__name">速写</span>
          <span class="brand__sub">LeetCode 智能补全</span>
        </span>
      </header>

      <div class="reveal">
        <div class="reveal__inner">
          <p class="tagline">
            在 LeetCode 编辑器里直接写代码，<br />补全、悬停与诊断都在行内生效。
          </p>

          <section class="langs" aria-label="支持语言">
            <span class="langs__label">支持语言</span>
            <ul class="langs__list">
              <li class="chip"><span class="chip__dot" aria-hidden="true"></span>Python</li>
              <li class="chip"><span class="chip__dot" aria-hidden="true"></span>C++</li>
              <li class="chip"><span class="chip__dot" aria-hidden="true"></span>JavaScript</li>
              <li class="chip"><span class="chip__dot" aria-hidden="true"></span>TypeScript</li>
            </ul>
          </section>

          <ul class="features">
            <li>智能补全：成员、方法与函数签名</li>
            <li>悬停提示：类型信息与参数说明</li>
            <li>实时诊断：语法与类型错误直接标红</li>
          </ul>

          <p class="hint">打开任意题目即自动启用，引擎全部在本机运行。</p>

          <footer class="credit">
            Power by <span class="credit__org">英格科技</span>
          </footer>
        </div>
      </div>
    </main>
  </body>
</html>
